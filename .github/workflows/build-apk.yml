name: Build DoseCerta APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          unzip -q DoseCerta.zip -d extracted

      - name: Conferir estrutura
        run: |
          ls -la extracted
          test -f extracted/package.json

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'
      - name: Instalar dependências
        working-directory: extracted
        run: npm install

      - name: Gerar versão web
        working-directory: extracted
        run: npm run build

      - name: Criar projeto Android
        working-directory: extracted
        run: npx cap add android

      - name: Configurar ícone do DoseCerta
        working-directory: extracted
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <group
                  android:rotation="-42"
                  android:pivotX="54"
                  android:pivotY="54">

                  <path
                      android:fillColor="#00000000"
                      android:strokeColor="#A6FF00"
                      android:strokeWidth="5"
                      android:strokeLineCap="round"
                      android:strokeLineJoin="round"
                      android:pathData="M54,25 C46.3,25 40,31.3 40,39 L40,69 C40,76.7 46.3,83 54,83 C61.7,83 68,76.7 68,69 L68,39 C68,31.3 61.7,25 54,25 Z" />

                  <path
                      android:fillColor="#00000000"
                      android:strokeColor="#A6FF00"
                      android:strokeWidth="5"
                      android:strokeLineCap="round"
                      android:pathData="M40,54 L68,54" />

              </group>
          </vector>
          EOF

          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <resources>
              <color name="ic_launcher_background">#050505</color>
          </resources>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF


      - name: Configurar permissão de alarmes exatos
        working-directory: extracted
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'

          if permission not in content:
              marker = '<application'
              if marker not in content:
                  raise SystemExit("Tag application não encontrada")
              content = content.replace(marker, permission + '\n    ' + marker, 1)
              manifest.write_text(content)
          PY

      - name: Sincronizar Capacitor
        working-directory: extracted
        run: npx cap sync android

      - name: Compilar APK
        working-directory: extracted/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DoseCerta-debug-apk
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
