name: Build DoseCerta APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          unzip -q DoseCerta.zip -d extracted

      - name: Conferir estrutura
        run: |
          ls -la extracted
          test -f extracted/package.json

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'
      - name: Instalar dependências
        working-directory: extracted
        run: npm install

      - name: Gerar versão web
        working-directory: extracted
        run: npm run build

      - name: Criar projeto Android
        working-directory: extracted
        run: npx cap add android

      - name: Configurar permissão de alarmes exatos
        working-directory: extracted
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'

          if permission not in content:
              marker = '<application'
              if marker not in content:
                  raise SystemExit("Tag application não encontrada")
              content = content.replace(marker, permission + '\n    ' + marker, 1)
              manifest.write_text(content)
          PY

      - name: Sincronizar Capacitor
        working-directory: extracted
        run: npx cap sync android

      - name: Compilar APK
        working-directory: extracted/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DoseCerta-debug-apk
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
