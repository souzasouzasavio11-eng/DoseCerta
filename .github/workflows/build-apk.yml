name: Build DoseCerta APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          unzip -q DoseCerta.zip -d extracted

      - name: Conferir estrutura
        run: |
          ls -la extracted
          test -f extracted/package.json

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'
      - name: Instalar dependências
        working-directory: extracted
        run: npm install

      - name: Gerar versão web
        working-directory: extracted
        run: npm run build

      - name: Criar projeto Android
        working-directory: extracted
        run: npx cap add android
        
      - name: Configurar ícone do DoseCerta
        working-directory: extracted
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values

          python3 -m pip install pillow

          cat > /tmp/create_icon.py <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import math

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          root = Path("android/app/src/main/res")
          green = "#A6FF00"
          black = "#050505"

          for density, size in sizes.items():
              img = Image.new("RGBA", (size, size), black)
              draw = ImageDraw.Draw(img)

              scale = size / 108
              cx, cy = 54 * scale, 54 * scale
              angle = math.radians(-42)

              def point(x, y):
                  dx = (x - 54) * scale
                  dy = (y - 54) * scale
                  return (
                      cx + dx * math.cos(angle) - dy * math.sin(angle),
                      cy + dx * math.sin(angle) + dy * math.cos(angle)
                  )

              points = [
                  point(54, 25),
                  point(40, 25),
                  point(40, 83),
                  point(54, 83),
                  point(68, 83),
                  point(68, 25)
              ]

              width = max(2, round(5 * scale))
              draw.line(
                  [point(54, 25), point(40, 39), point(40, 69),
                   point(54, 83), point(68, 69), point(68, 39),
                   point(54, 25)],
                  fill=green,
                  width=width,
                  joint="curve"
              )

              draw.line(
                  [point(40, 54), point(68, 54)],
                  fill=green,
                  width=width
              )

              path = root / f"mipmap-{density}" / "ic_launcher.png"
              path.parent.mkdir(parents=True, exist_ok=True)
              img.save(path)

              round_path = path.parent / "ic_launcher_round.png"
              img.save(round_path)

          PY

          python3 /tmp/create_icon.py

          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <resources>
              <color name="ic_launcher_background">#050505</color>
          </resources>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher"/>
          </adaptive-icon>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_round"/>
          </adaptive-icon>
          EOF

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          content = content.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@mipmap/ic_launcher"'
          )

          manifest.write_text(content)
          PY
          
      - name: Configurar permissão de alarmes exatos
        working-directory: extracted
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'

          if permission not in content:
              marker = '<application'
              if marker not in content:
                  raise SystemExit("Tag application não encontrada")
              content = content.replace(marker, permission + '\n    ' + marker, 1)
              manifest.write_text(content)
          PY

      - name: Sincronizar Capacitor
        working-directory: extracted
        run: npx cap sync android

      - name: Compilar APK
        working-directory: extracted/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DoseCerta-debug-apk
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
