name: Build DoseCerta APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          unzip -q DoseCerta.zip -d extracted

      - name: Conferir estrutura
        run: |
          ls -la extracted
          test -f extracted/package.json

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'
      - name: Instalar dependências
        working-directory: extracted
        run: npm install

      - name: Gerar versão web
        working-directory: extracted
        run: npm run build

      - name: Criar projeto Android
        working-directory: extracted
        run: npx cap add android
        
      - name: Configurar ícone do DoseCerta
        working-directory: extracted
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values

          python3 -m pip install pillow

          cat > /tmp/create_icon.py <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import math

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          root = Path("android/app/src/main/res")
          green = "#A6FF00"
          black = "#050505"

          for density, size in sizes.items():
              img = Image.new("RGBA", (size, size), black)
              draw = ImageDraw.Draw(img)

              scale = size / 108
              cx, cy = 54 * scale, 54 * scale
              angle = math.radians(-42)

              def point(x, y):

      - name: Configurar ícone do DoseCerta
        working-directory: extracted
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values

          python3 -m pip install pillow

          cat > android/app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <group
                  android:rotation="-42"
                  android:pivotX="54"
                  android:pivotY="54">

                  <path
                      android:pathData="M54,25 C45.16,25 38,32.16 38,41 L38,67 C38,75.84 45.16,83 54,83 C62.84,83 70,75.84 70,67 L70,41 C70,32.16 62.84,25 54,25 Z"
                      android:fillColor="#00000000"
                      android:strokeColor="#A6FF00"
                      android:strokeWidth="4"
                      android:strokeLineCap="round"
                      android:strokeLineJoin="round"/>

                  <path
                      android:pathData="M38,54 L70,54"
                      android:strokeColor="#A6FF00"
                      android:strokeWidth="4"
                      android:strokeLineCap="round"/>

              </group>
          </vector>
          EOF

          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <resources>
              <color name="ic_launcher_background">#000000</color>
          </resources>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > /tmp/create_icon.py <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          root = Path("android/app/src/main/res")
          scale_factor = 4

          for density, size in sizes.items():
              s = size * scale_factor
              scale = s / 108

              background = Image.new("RGBA", (s, s), "#000000")
              symbol = Image.new("RGBA", (s, s), (0, 0, 0, 0))
              draw = ImageDraw.Draw(symbol)

              box = (
                  38 * scale,
                  25 * scale,
                  70 * scale,
                  83 * scale
              )

              draw.rounded_rectangle(
                  box,
                  radius=16 * scale,
                  outline="#A6FF00",
                  width=max(1, round(4 * scale))
              )

              draw.line(
                  (38 * scale, 54 * scale, 70 * scale, 54 * scale),
                  fill="#A6FF00",
                  width=max(1, round(4 * scale))
              )

              symbol = symbol.rotate(
                  -42,
                  resample=Image.Resampling.BICUBIC,
                  center=(54 * scale, 54 * scale)
              )

              background.alpha_composite(symbol)
              background = background.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              background.save(folder / "ic_launcher.png")
              background.save(folder / "ic_launcher_round.png")
          PY

          python3 /tmp/create_icon.py

      - name: Configurar permissão de alarmes exatos
        working-directory: extracted
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'

          if permission not in content:
              marker = '<application'
              if marker not in content:
                  raise SystemExit("Tag application não encontrada")
              content = content.replace(marker, permission + '\n    ' + marker, 1)
              manifest.write_text(content)
          PY

      - name: Sincronizar Capacitor
        working-directory: extracted
        run: npx cap sync android

      - name: Compilar APK
        working-directory: extracted/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DoseCerta-debug-apk
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
